<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/shell :: head('Sign in')}"></head>
<body>
<main class="auth" id="main">
    <h1>Operations Center</h1>
    <p>Sign in to inspect tasks and execution records.</p>
    <p role="alert" th:if="${param.error}">Sign-in failed. Check your credentials and try again.</p>
    <p role="status" th:if="${param.logout}">You have signed out.</p>
    <form th:action="@{/login}" method="post" class="login-form">
        <div class="field"><label for="username">Username</label><input id="username" name="username" autocomplete="username" required></div>
        <div class="field"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required></div>
        <button type="submit">Sign in</button>
    </form>
</main>
</body>
</html>
